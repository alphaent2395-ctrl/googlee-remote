
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Googlee Remote</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 85%;
      max-width: 400px;
      padding: 25px;
      background: #1e293b;
      border-radius: 18px;
      text-align: center;
    }
    h1 { color: #60a5fa; }
    p { color: #cbd5e1; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      border: 1px solid #64748b;
      background: #0f172a;
      color: white;
    }
    button {
      border: 0;
      background: #3b82f6;
      color: white;
      font-weight: bold;
    }
    #status { margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Googlee Remote</h1>
    <p>Connect to your own Android phone</p>
    <input id="code" placeholder="Enter pairing code">
    <button onclick="connect()">Connect</button>
    <p id="status">Waiting for connection.</p>
  </main>
  <script>
    function connect() {
      const code = document.getElementById("code").value.trim();
      const status = document.getElementById("status");
      if (!code) {
        status.textContent = "Please enter a pairing code.";
        return;
      }
      status.textContent =
        "Code entered. Remote connection is not configured yet.";
    }
  </script>
</body>
</html>
